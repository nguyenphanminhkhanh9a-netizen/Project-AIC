[project]
name = "project-aic-backend"
version = "0.5.0"
description = "Project AIC local FastAPI managed sidecar backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "pillow>=13.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
cpu = [
    "onnxruntime>=1.19.0",
]
directml = [
    "onnxruntime-directml>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
cpu = [
    "onnxruntime>=1.19.0",
]
directml = [
    "onnxruntime-directml>=1.19.0",
]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "directml" },
    ],
    [
        { group = "cpu" },
        { group = "directml" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "directml_hardware: marks genuine hardware integration tests requiring real DirectX 12 GPU",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true
