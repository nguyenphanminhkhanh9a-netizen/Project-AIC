name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-validation:
    name: Dependency Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Validate uv.lock synchronization
        working-directory: backend
        run: |
          uv lock --check

      - name: Verify dependency tree consistency
        working-directory: backend
        run: |
          uv sync --locked --no-install-project

  backend-ci:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dependency-validation
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU & Dev)
        run: |
          uv sync --locked --extra dev --extra cpu

      - name: Run Ruff Linting
        run: |
          uv run ruff check .

      - name: Run Mypy Type Checking
        run: |
          uv run mypy app tests

      - name: Run Pytest Suite
        run: |
          uv run pytest -v

  frontend-ci:
    name: Frontend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for package.json presence
        id: check-frontend
        run: |
          if [ -f "package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
            echo "frontend_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "apps/desktop/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
            echo "frontend_dir=apps/desktop" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "frontend_dir=." >> "$GITHUB_OUTPUT"
            echo "Notice: Frontend (Tauri 2 + React) not initialized in Milestone 0. Skipping frontend checks."
          fi

      - name: Set up Node.js 20
        if: steps.check-frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ steps.check-frontend.outputs.frontend_dir }}/package-lock.json"

      - name: Install npm dependencies
        if: steps.check-frontend.outputs.has_frontend == 'true'
        working-directory: ${{ steps.check-frontend.outputs.frontend_dir }}
        run: |
          npm ci

      - name: Run TypeScript type check
        if: steps.check-frontend.outputs.has_frontend == 'true'
        working-directory: ${{ steps.check-frontend.outputs.frontend_dir }}
        run: |
          npm run typecheck

      - name: Run ESLint
        if: steps.check-frontend.outputs.has_frontend == 'true'
        working-directory: ${{ steps.check-frontend.outputs.frontend_dir }}
        run: |
          npm run lint

      - name: Run Production Build
        if: steps.check-frontend.outputs.has_frontend == 'true'
        working-directory: ${{ steps.check-frontend.outputs.frontend_dir }}
        run: |
          npm run build
